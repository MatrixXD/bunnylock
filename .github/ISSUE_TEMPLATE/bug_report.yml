name: Bug report
description: Something doesn't work on your phone.
title: "[Phone model]: "
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Phone
      description: Model and Android version.
      placeholder: Xiaomi POCO X6 5G, Android 16
    validations:
      required: true

  - type: dropdown
    id: access
    attributes:
      label: Access
      options:
        - Root
        - Shizuku
        - Shizuku with root
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: Shown at the top of the app.
      options:
        - Qualcomm QMI
        - MediaTek AT
        - Pixel (Tensor NV)
        - Android radio HAL
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: What were you doing?
      multiple: true
      options:
        - Band lock
        - Unlock
        - Cell lock
        - Network mode
        - 5G mode
        - Network (PLMN) lock
        - AT console
        - Connecting
        - Something else
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Locked LTE to B3
        2. Pressed Unlock all
        3. The phone still stays on B3
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Right after the problem, go to Tools, tap "Copy diagnostics" and paste it here.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, error messages, or what fixed it for you.
    validations:
      required: false
